name: revalue

x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    image: revalue:latest
    restart: unless-stopped
    env_file: .env
    volumes:
        - storage:/var/www/html/storage
    logging:
        driver: json-file
        options:
            max-size: '10m'
            max-file: '3'

services:
    app:
        <<: *app
        ports:
            - '127.0.0.1:8005:8005'
        depends_on:
            db:
                condition: service_healthy

    queue:
        <<: *app
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=3',
                '--tries=3',
                '--max-time=3600',
            ]
        depends_on:
            app:
                condition: service_started

    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            app:
                condition: service_started

    db:
        image: mysql:8.0
        restart: unless-stopped
        command:
            - '--default-authentication-plugin=mysql_native_password'
            - '--innodb-buffer-pool-size=256M'
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

volumes:
    storage:
    dbdata:
