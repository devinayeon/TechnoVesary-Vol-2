name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image untuk rollback (kosongkan untuk build dari commit terbaru)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/tunggulalmajid/technovesary-vol-2

jobs:
  build:
    name: Build & push image
    if: github.event_name == 'push' || github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=ReValue
            VITE_BASEMAP_API_KEY=${{ vars.VITE_BASEMAP_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Prepare environment file
        env:
          RAW_ENV: ${{ secrets.PRODUCTION_ENV || secrets.PRODUCTION_ENV_B64 }}
        run: |
          if [ -z "$RAW_ENV" ]; then
            echo "::error::Secret PRODUCTION_ENV tidak ditemukan. Pastikan sudah menambahkan secret PRODUCTION_ENV di GitHub Secrets."
            exit 1
          fi
          # Mendukung tempel teks .env secara langsung (plaintext) maupun format base64,
          # serta membersihkan karakter Windows carriage return (\r) agar kompatibel dengan Linux server.
          if echo "$RAW_ENV" | grep -q "="; then
            printf '%s\n' "$RAW_ENV" | tr -d '\r' | base64 -w 0 > env.b64
          else
            printf '%s' "$RAW_ENV" | tr -d '\r\n ' > env.b64
          fi
          echo "ENV_B64=$(cat env.b64)" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_B64: ${{ env.ENV_B64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_B64
          script_stop: true
          script: |
            set -e
            cd /opt/revalue
            printf '%s' "$ENV_B64" | base64 -d > .env
            chmod 600 .env
            ./deploy/deploy.sh "${{ github.sha }}" "${{ github.event.inputs.image_tag }}"
